name: Browser runtime tests
on:
  push:
    branches: ["feat/browser-character-runtime"]
  pull_request:
    paths:
      - "mcp_api.js"
      - "node/test/browser_character_runtime.test.js"
      - ".github/workflows/browser_runtime.yml"
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test node/test/browser_character_runtime.test.js
